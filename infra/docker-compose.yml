services:
  postgres:
    image: postgres:16
    container_name: reflex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reflex
      POSTGRES_USER: reflex
      POSTGRES_PASSWORD: reflex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
